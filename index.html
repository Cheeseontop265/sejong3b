<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="세종 3B">
<meta name="theme-color" content="#F4F2EC">
<title>세종한국어 3B · HanaAI</title>
<style>
:root{--bg:#F4F2EC;--card:#FDFCF9;--ink:#26241E;--muted:#7B766B;--line:#E7E2D6;--soft:#EFEBE0;--accent:#C15F3C;--accent-soft:#F3E4DC;--green:#5E7A55;--olive:#8A9660;--amber:#C6A15B;--terra:#C07A4D;--gray:#A9A395;--red:#B4543A;--okbg:#EDF1E6;--nobg:#F6E7E1}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1,h2,.serif{font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
.pagehead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.pagehead h1{font-size:24px;flex:1}
.sub{color:var(--muted);font-size:14px}
.backbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sec{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:18px 2px 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600;width:100%;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:var(--soft)}
.btn.sm{min-height:44px;font-size:14.5px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:5px 12px;font-size:13.5px;margin:0 6px 6px 0;color:#4d493f}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:3px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.vrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.vrow:last-child{border-bottom:none}
.vko{font-weight:600}
.vvi{color:var(--muted);font-size:14px;display:none;margin-top:2px}
.vrow.open .vvi{display:block}
.hint{font-size:12.5px;color:var(--muted);margin:4px 2px 8px}
.spk{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:15px;flex:none;display:flex;align-items:center;justify-content:center}
.lrow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lnum{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#5a5548;flex:none}
.ltit{font-weight:600;font-size:15px}
.lsub{font-size:13px;color:var(--muted)}
.gform{font-family:ui-serif,Georgia,serif;font-size:20px;font-weight:700}
.gex{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.gex .vi{color:var(--muted);font-size:13.5px;margin-top:2px}
.gnote{font-size:13.5px;color:#6b5d4f;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-top:10px}
.acc{cursor:pointer}.accbody{display:none;margin-top:10px}.acc.open .accbody{display:block}
.chev{color:var(--muted);transition:transform .2s}.acc.open .chev{transform:rotate(90deg)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:13px 14px;font-size:16px;margin-bottom:9px;font-family:inherit;cursor:pointer}
.opt.ok{border-color:var(--green);background:var(--okbg)}
.opt.no{border-color:var(--red);background:var(--nobg)}
.opt[disabled]{opacity:.55}.opt.ok[disabled],.opt.no[disabled]{opacity:1}
.expl{background:var(--soft);border-radius:12px;padding:11px 13px;font-size:14.5px;margin:4px 0 12px}
.expl.good{background:var(--okbg)}.expl.bad{background:var(--nobg)}
.qprompt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 18px;text-align:center;margin-bottom:14px}
.qbig{font-family:ui-serif,Georgia,serif;font-size:26px;font-weight:700;line-height:1.4}
.qmid{font-size:19px;font-weight:600;line-height:1.45}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.timer{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-bottom:12px}
.timer>i{display:block;height:100%;background:var(--terra);transform-origin:left;animation:tk linear forwards}
@keyframes tk{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.fcwrap{perspective:1200px;margin:2px 0 14px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gbtn{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 4px;font-family:inherit;cursor:pointer}
.gbtn b{display:block;font-size:14.5px}.gbtn span{font-size:11.5px;color:var(--muted)}
.gbtn:active{transform:scale(.97)}.g0{border-color:#d9b3a6}.g3{border-color:#c9d0b8}
.wchip{display:inline-block;padding:9px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16.5px;font-weight:600;margin:0 7px 9px 0;cursor:pointer;font-family:inherit}
.wchip:active{transform:scale(.95)}
.wchip.used{opacity:.22;pointer-events:none}
.ansline{min-height:58px;border-bottom:2px dashed var(--line);padding:4px 2px 8px;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{border:1.5px solid var(--line);border-radius:12px;min-height:68px;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;font-size:13.5px;font-weight:600;background:var(--card);cursor:pointer;font-family:inherit;line-height:1.3}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.done{opacity:.15;pointer-events:none}
.tile.err{border-color:var(--red);background:var(--nobg)}
.tinput{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;font-size:16px;font-family:inherit;background:var(--card);color:var(--ink);margin-bottom:10px}
.tinput:focus{outline:none;border-color:var(--accent)}
textarea.tinput{min-height:130px;line-height:1.6;resize:vertical}
.modecard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font-family:inherit}
.modecard:active{transform:scale(.985)}
.micon{width:44px;height:44px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.mtit{font-weight:700;font-size:15.5px}.msub{font-size:13px;color:var(--muted)}
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(250,249,244,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:50}
#tabbar .inner{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 3px;color:var(--muted);font-size:10.5px;border:none;background:none;font-family:inherit;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.stat:last-child{border:none}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:#5a5548}
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.bigxp{font-family:ui-serif,Georgia,serif;font-size:44px;font-weight:700;text-align:center;margin:10px 0 2px}
.center{text-align:center}.mt{margin-top:12px}
.warn{font-size:13px;color:var(--muted);font-style:italic}
.rline{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rline:last-child{border:none}
.rtxt{flex:1;font-size:18px;line-height:2.0}
.tok{cursor:pointer;border-radius:6px;padding:1px 2px}
.tok:active,.tok.hl{background:var(--accent-soft);color:#8a3f22}
#glossbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 68px);display:flex;justify-content:center;z-index:60;pointer-events:none}
#glossbar .in{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:#F7F5EF;border-radius:14px;padding:11px 16px;max-width:520px;margin:0 14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#glossbar b{font-size:17px}
#glossbar .g{font-size:14px;opacity:.85}
.worig{color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px}
.wfix{color:var(--green);font-weight:700}
.spin{width:26px;height:26px;border:3px solid var(--soft);border-top-color:var(--accent);border-radius:50%;margin:0 auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

function touchStreak(){const t=new Date().toDateString();if(S.lastDay===t)return;const y=new Date(Date.now()-864e5).toDateString();S.streak=(S.lastDay===y)?S.streak+1:1;S.lastDay=t;save()}
function cid(l,t,i){return l+"-"+t+"-"+i}
function lessonVocab(l,ex){const o=LS[l-1];let a=o.c.map((p,i)=>({id:cid(l,"c",i),ko:p[0],vi:p[1],l,core:true}));if(ex)a=a.concat(o.e.map((p,i)=>({id:cid(l,"e",i),ko:p[0],vi:p[1],l,core:false})));return a}

const GALL=LS.flatMap(o=>o.g.map(g=>({...g,ln:o.n})));
function grade(id,g){const now=Date.now();let c=S.cards[id]||{ease:2.5,int:0,reps:0,lapse:0};
 if(g===0){c.ease=Math.max(1.3,c.ease-0.2);c.int=0;c.due=now+6e5;c.lapse=(c.lapse||0)+1;c.reps=Math.max(c.reps,1)}
 else{if(c.int===0){c.int=g===1?0.5:g===2?1:3}else{c.int=g===1?Math.max(1,c.int*1.2):g===2?c.int*c.ease:Math.min(365,c.int*c.ease*1.3)}
 if(g===1)c.ease=Math.max(1.3,c.ease-0.15);if(g===3)c.ease=Math.min(2.8,c.ease+0.15);c.reps++;c.due=now+c.int*864e5}
 S.cards[id]=c;S.xp+=(g===0?0:g===1?2:5);touchStreak();save()}
function fmtI(d){if(d<0.05)return"10분";if(d<1)return Math.max(1,Math.round(d*24))+"시간";return Math.round(d)+"일"}
function pv(id,g){const c=S.cards[id];if(g===0)return"10분";if(!c||c.int===0)return g===1?"12시간":g===2?"1일":"3일";let i=g===1?Math.max(1,c.int*1.2):g===2?c.int*c.ease:Math.min(365,c.int*c.ease*1.3);return fmtI(i)}

function mkItem(v,pool,forceEx){let m=mast(v.id),ex=forceEx;
 if(!ex){if(m<=0)ex="mc_kv";else if(m===1)ex=Math.random()<.5?"mc_kv":"mc_vk";else if(m===2)ex=Math.random()<.4?"flip":"mc_vk";else ex=Math.random()<.6?"type":"mc_vk"}
 const it={v,ex};if(ex==="mc_kv"||ex==="mc_vk")it.opts=mkOpts(v,pool);return it}
function startSmart(l){let vs;const now=Date.now();
 if(l){const all=lessonVocab(l,S.incExp);const due=all.filter(v=>S.cards[v.id]&&S.cards[v.id].due<=now);const nw=all.filter(v=>!S.cards[v.id]);vs=[...due,...nw].slice(0,14);if(!vs.length)vs=shuffle([...all]).slice(0,14)}
 else{const ids=dueIds();if(!ids.length)return;vs=ids.map(id=>VMAP[id]).slice(0,20)}
 const pool=l?lessonVocab(l,true):Object.values(VMAP);
 sm={q:vs.map(v=>mkItem(v,pool)),i:0,ans:null,flip:false,typed:"",hint:false,ok:0,bad:0,pool,from:l||null,fb:"",tk:0};go("smart")}
function smCur(){return sm.q[sm.i]}
function smRequeue(v){sm.q.splice(Math.min(sm.i+3,sm.q.length),0,mkItem(v,sm.pool,"mc_kv"))}
function armTimer(){if(smT)clearTimeout(smT);if(!sm||sm.ans||sm.i>=sm.q.length)return;const it=smCur();if(it.ex!=="mc_kv"&&it.ex!=="mc_vk")return;
 sm.tk++;const my=sm.tk;smT=setTimeout(()=>{if(route.v==="smart"&&sm&&sm.tk===my&&!sm.ans){sm.bad++;grade(smCur().v.id,0);smRequeue(smCur().v);sm.ans={sel:-2,ok:false};sm.fb="⏱ 시간 초과 — "+oops();render()}},8000)}
function smPick(i){if(!sm||sm.ans)return;sm.tk++;const it=smCur(),ok=it.opts[i].ko===it.v.ko;
 if(ok){sm.ok++;grade(it.v.id,2);sm.fb=yay()}else{sm.bad++;grade(it.v.id,0);smRequeue(it.v);sm.fb=oops()}
 sm.ans={sel:i,ok};render()}
function smFlip(){if(sm&&!sm.flip){sm.flip=true;render()}}
function smGrade(g){const it=smCur();grade(it.v.id,g);if(g===0){sm.bad++;sm.q.splice(Math.min(sm.i+3,sm.q.length),0,{v:it.v,ex:"flip"})}else sm.ok++;smNext()}
function smSubmit(){if(!sm||sm.ans)return;const it=smCur(),ok=norm(sm.typed)===norm(it.v.ko);
 if(ok){sm.ok++;grade(it.v.id,sm.hint?1:2);S.xp+=3;save();sm.fb=yay()}else{sm.bad++;grade(it.v.id,0);smRequeue(it.v);sm.fb=oops()}
 sm.ans={ok};render()}

function smNext(){sm.i++;sm.ans=null;sm.flip=false;sm.typed="";sm.hint=false;sm.fb="";render();window.scrollTo(0,0)}

  <div class="mt" style="font-size:16px"><span class="worig">${c.orig}</span> → <span class="wfix">${c.fix}</span></div>
  <div class="sub" style="margin-top:6px">💡 ${c.why}</div></div>`).join("")}`
 :`<div class="card" style="background:var(--okbg)">🎉 교정할 곳이 없어요 — 훌륭해요!</div>`}
 ${wr.res.natural?`<div class="sec">자연스러운 버전</div><div class="card"><div style="line-height:1.8">${wr.res.natural}</div>
 <button class="spk mt" onclick="spk(event,'${(wr.res.natural||"").replace(/['"\n]/g," ")}')">🔊</button></div>`:""}
 ${(wr.res.used_grammar&&wr.res.used_grammar.length)?`<div class="sec">사용한 3B 문법</div><div class="card">${wr.res.used_grammar.map(g=>`<span class="chip">✅ ${g}</span>`).join("")}</div>`:""}
 ${wr.res.tip?`<div class="card gnote" style="margin-top:12px">💡 ${wr.res.tip}</div>`:""}
 <button class="btn mt" onclick="wr.res=null;render()">다시 쓰기</button>`:""}`}

function vSmart(){if(!sm)return vPractice();
 if(sm.i>=sm.q.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>세션 완료</h1></div>
  <div class="card center"><div style="font-size:40px">🌿</div><div class="bigxp">${sm.ok}<span style="font-size:20px;color:var(--muted)"> 정답</span></div>
  <div class="sub">${sm.bad?`틀린 ${sm.bad}번은 모두 다시 맞힐 때까지 반복했어요.`:"한 번에 전부 통과! 대단해요."}</div></div>
  <button class="btn primary" onclick="back()">완료</button>`}
 const it=smCur(),v=it.v,left=sm.q.length-sm.i;let body="";
 const fb=sm.ans?`<div class="expl ${sm.ans.ok?"good":"bad"}">${sm.ans.ok?"✅ ":"❌ "}${sm.fb}<br><b>${v.ko}</b> — ${v.vi}</div><button class="btn primary" onclick="smNext()">다음</button>`:"";
 if(it.ex==="mc_kv"||it.ex==="mc_vk"){const kv=it.ex==="mc_kv";
  body=`${sm.ans?"":`<div class="timer"><i style="animation-duration:8s"></i></div>`}
  <div class="qprompt"><div class="tag">${kv?"뜻은 무엇일까요?":"한국어로는?"} · ${v.l}과</div>
   <div class="${kv?"qbig":"qmid"}">${kv?v.ko:v.vi}</div>
   ${kv?`<button class="spk mt" style="margin:10px auto 0" onclick="spk(event,'${v.ko}')">🔊</button>`:""}</div>
  ${it.opts.map((o,i)=>{let cl="opt";if(sm.ans){if(o.ko===v.ko)cl+=" ok";else if(i===sm.ans.sel)cl+=" no"}
   return `<button class="${cl}" ${sm.ans?"disabled":""} onclick="smPick(${i})">${kv?o.vi:o.ko}</button>`}).join("")}${fb}`}
 else if(it.ex==="flip"){
  body=`<div class="fcwrap"><div class="fc ${sm.flip?"flipped":""}" onclick="smFlip()">
   <div class="face"><div class="tag">기억해 보세요 · ${v.l}과</div><div class="qbig">${v.ko}</div>
    <button class="spk mt" onclick="spk(event,'${v.ko}')">🔊</button><div class="sub mt" style="font-size:13px">탭해서 확인</div></div>
   <div class="face back"><div class="tag">정답</div><div class="qbig" style="font-size:23px">${v.ko}</div>
    <div class="sub mt" style="font-size:17px">${v.vi}</div></div></div></div>
  ${sm.flip?`<div class="grades">
   <button class="gbtn g0" onclick="smGrade(0)"><b>다시</b><span>${pv(v.id,0)}</span></button>
   <button class="gbtn" onclick="smGrade(1)"><b>어려움</b><span>${pv(v.id,1)}</span></button>
   <button class="gbtn" onclick="smGrade(2)"><b>좋음</b><span>${pv(v.id,2)}</span></button>
   <button class="gbtn g3" onclick="smGrade(3)"><b>쉬움</b><span>${pv(v.id,3)}</span></button></div>`
  :`<button class="btn" onclick="smFlip()">카드 뒤집기</button>`}`}
 else{body=`<div class="qprompt"><div class="tag">한국어로 입력해 보세요 · ${v.l}과</div><div class="qmid">${v.vi}</div>
   ${sm.hint?`<div class="sub mt">힌트: <b>${v.ko.slice(0,2)}…</b></div>`:""}</div>
  ${sm.ans?fb:`<input class="tinput" type="text" placeholder="한국어로 입력" value="${sm.typed.replace(/"/g,"")}" oninput="sm.typed=this.value" onkeydown="if(event.key==='Enter')smSubmit()" autocapitalize="off" autocorrect="off" autocomplete="off">
  <div class="row2"><button class="btn sm ghost" onclick="smHint()" ${sm.hint?"disabled":""}>💡 힌트</button><button class="btn sm primary" onclick="smSubmit()">확인</button></div>`}`}
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button>
  <div style="flex:1"><div class="bar"><i style="width:${Math.round(sm.i/sm.q.length*100)}%"></i></div></div>
  <span class="pill">남은 ${left}</span></div>${body}`}

function vScram(){if(!sc)return vPractice();
 if(sc.i>=sc.list.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>완료!</h1></div>
  <div class="card center"><div style="font-size:40px">🧩</div><div class="bigxp">${sc.list.length}문장</div>
  <div class="sub">한국어 어순이 손에 익어 가고 있어요.</div></div>
  <button class="btn primary" onclick="back()">완료</button>`}
 const q=scQ();const used=new Set(sc.chosen);
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button>
  <div style="flex:1"><div class="bar"><i style="width:${Math.round(sc.i/sc.list.length*100)}%"></i></div></div>
  <span class="pill">${sc.i+1}/${sc.list.length}</span></div>
 <div class="qprompt" style="padding:18px">
  <div class="tag">${sc.listen?"🎧 듣고 순서대로 만들어 보세요":"문장을 만들어 보세요"} · ${q.l}과</div>
  ${sc.listen?`<button class="btn sm ghost" style="max-width:170px;margin:0 auto" onclick="scReplay()">🔊 다시 듣기</button>`:`<div class="qmid" style="font-size:16.5px;color:var(--muted)">${q.vi}</div>`}</div>
 <div class="ansline">${sc.chosen.map((wi,ci)=>`<button class="wchip" onclick="scUndo(${ci})">${q.words[wi]}</button>`).join("")||`<span class="hint">아래 칩을 순서대로 탭하세요</span>`}</div>
 <div>${q.words.map((w,wi)=>`<button class="wchip ${used.has(wi)?"used":""}" onclick="scTap(${wi})">${w}</button>`).join("")}</div>
 ${sc.state==="ok"?`<div class="expl good">✅ ${yay()}<br><b>${q.ko}</b><br><span class="sub">${q.vi}</span></div><button class="btn primary" onclick="scNext()">다음</button>`
 :sc.state==="no"?`<div class="expl bad">❌ 정답은:<br><b>${q.ko}</b><br><span class="sub">${q.vi}</span></div><button class="btn primary" onclick="scNext()">다음</button>`
 :`<button class="btn primary mt" ${sc.chosen.length===q.words.length?"":"disabled"} onclick="scCheck()">확인</button>`}`}

function vContrast(){if(!ct)return vPractice();
 if(ct.i>=ct.list.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>문법 대결 결과</h1></div>
  <div class="card center"><div class="bigxp">${ct.ok}<span style="font-size:22px;color:var(--muted)">/${ct.list.length}</span></div>
  <div class="sub">${ct.ok===ct.list.length?"문법 감각이 정확해요! ⚖️":"틀린 문항의 설명을 다시 읽어 보세요."}</div></div>
  <button class="btn primary" onclick="back()">완료</button>`}
 const q=ct.list[ct.i];
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button>
  <div style="flex:1"><div class="bar"><i style="width:${Math.round(ct.i/ct.list.length*100)}%"></i></div></div>
  <span class="pill">${ct.i+1}/${ct.list.length}</span></div>
 <div class="qprompt"><div class="tag">어느 쪽이 자연스러울까요? · ${q.l}과</div>
  <div class="qmid" style="font-size:17.5px">${q.q.replace("___","<b style='color:var(--accent)'>______</b>")}</div></div>
 ${q.opts.map((o,i)=>{let cl="opt";if(ct.ans!==null){if(i===q.a)cl+=" ok";else if(i===ct.ans)cl+=" no"}
  return `<button class="${cl}" ${ct.ans!==null?"disabled":""} onclick="ctPick(${i})" style="text-align:center;font-weight:700">${o}</button>`}).join("")}
 ${ct.ans!==null?`<div class="expl ${ct.ans===q.a?"good":"bad"}">${ct.ans===q.a?"✅ 정답!":"❌ 아쉬워요."}<br><b>왜?</b> ${q.why}</div>
 <button class="btn primary" onclick="ctNext()">${ct.i+1>=ct.list.length?"결과 보기":"다음"}</button>`:""}`}

function vMatch(){if(!mg)return vPractice();
 const done=mg.found===6;
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button>
  <div style="flex:1"><h1 style="font-size:20px">짝 맞추기</h1><div class="sub">단어와 뜻을 연결하세요 · 실수 ${mg.miss}</div></div></div>
 <div class="tiles">${mg.tiles.map((t,i)=>{let cl="tile";if(t.done)cl+=" done";if(mg.sel===i)cl+=" sel";if(mg.err&&mg.err.includes(i))cl+=" err";
  return `<button class="${cl}" onclick="mgTap(${i})">${t.txt}</button>`}).join("")}</div>
 ${done?`<div class="card center mt"><div style="font-size:34px">🎉</div><b>완료!</b><div class="sub">실수 ${mg.miss}번 · +${Math.max(5,15-2*mg.miss)} XP</div></div>
 <div class="row2"><button class="btn" onclick="startMatch(mg.from)">한 번 더</button><button class="btn primary" onclick="back()">완료</button></div>`:""}`}

function vQuiz(){if(!qz)return vPractice();
 if(qz.i>=qz.qs.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>퀴즈 결과</h1></div>
  <div class="card center"><div class="bigxp">${qz.score}<span style="font-size:22px;color:var(--muted)">/${qz.qs.length}</span></div>
  <div class="sub">${qz.score===qz.qs.length?"완벽해요! 🎉":qz.score>=7?"좋아요, 거의 다 왔어요.":"틀린 부분을 아래에서 복습해요."}</div></div>
  ${qz.wrong.length?`<div class="sec">다시 볼 항목</div>${qz.wrong.map(q=>q.t==="kv"||q.t==="vk"
   ?`<div class="card"><b>${q.item.ko}</b><div class="sub">${q.item.vi}</div></div>`
   :`<div class="card"><b class="gform" style="font-size:17px">${q.g.f}</b><div class="sub">${q.g.m}</div><div class="gex">${q.g.ex[0][0]}<div class="vi">${q.g.ex[0][1]}</div></div></div>`).join("")}`:""}
  <button class="btn primary" onclick="back()">완료</button>`}
 const q=qz.qs[qz.i],an=qz.ans!==null;let prompt,opts,expl;
 if(q.t==="kv"){prompt=`<div class="tag">뜻은 무엇일까요?</div><div class="qbig">${q.item.ko}</div>`;opts=q.opts.map(o=>o.vi);expl=`<b>${q.item.ko}</b> — ${q.item.vi}`}
 else if(q.t==="vk"){prompt=`<div class="tag">한국어로는?</div><div class="qmid">${q.item.vi}</div>`;opts=q.opts.map(o=>o.ko);expl=`<b>${q.item.ko}</b> — ${q.item.vi}`}
 else if(q.t==="gm"){prompt=`<div class="tag">이 문법의 의미는? (${q.g.ln}과)</div><div class="gform">${q.g.f}</div>`;opts=q.opts.map(o=>o.s);expl=`<b>${q.g.f}</b>: ${q.g.m}<br>예) ${q.g.ex[0][0]}`}
 else{prompt=`<div class="tag">어떤 문법일까요?</div><div class="qmid">“${q.g.s}”</div>`;opts=q.opts.map(o=>o.f);expl=`<b>${q.g.f}</b>: ${q.g.m}<br>예) ${q.g.ex[0][0]}`}
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button>
  <div style="flex:1"><div class="bar"><i style="width:${Math.round(qz.i/qz.qs.length*100)}%"></i></div></div>
  <span class="pill">${qz.i+1}/${qz.qs.length}</span></div>
 <div class="qprompt">${prompt}</div>
 ${opts.map((o,i)=>{let cl="opt";if(an){if(i===q.a)cl+=" ok";else if(i===qz.ans)cl+=" no"}
  return `<button class="${cl}" ${an?"disabled":""} onclick="pick(${i})">${o}</button>`}).join("")}
 ${an?`<div class="expl ${qz.ans===q.a?"good":"bad"}">${qz.ans===q.a?"✅ 정답!":"❌ 아쉬워요."}<br>${expl}</div>
 <button class="btn primary" onclick="nextQ()">${qz.i+1>=qz.qs.length?"결과 보기":"다음"}</button>`:""}`}

function vCheck(){const done=CHECK.filter((_,i)=>S.chk[i]).length;
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:20px">3B 시작 전 체크리스트</h1><div class="sub">${done}/${CHECK.length} 완료</div></div></div>
 <div class="card">${CHECK.map((c,i)=>`<label class="chk"><input type="checkbox" ${S.chk[i]?"checked":""} onchange="setChk(${i},this.checked)"><span>${c}</span></label>`).join("")}</div>
 <div class="card"><b>우선 점검 영역</b><div class="sub" style="margin-top:6px">말하기 유창성 · 능동 어휘 · 자막 없는 듣기 · 문단 구성 · 조사 · 높임말</div></div>`}

render();
</script>
</body>
</html>
