<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="세종 3B">
<meta name="theme-color" content="#F4F2EC">
<title>세종한국어 3B · HanaAI</title>
<style>
:root{
  --bg:#F4F2EC; --card:#FDFCF9; --ink:#26241E; --muted:#7B766B;
  --line:#E7E2D6; --soft:#EFEBE0; --accent:#C15F3C; --accent-soft:#F3E4DC;
  --green:#5E7A55; --olive:#8A9660; --amber:#C6A15B; --terra:#C07A4D; --gray:#A9A395;
  --red:#B4543A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1,h2,.serif{font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
.pagehead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.pagehead h1{font-size:24px;flex:1}
.sub{color:var(--muted);font-size:14px}
.backbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sec{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:18px 2px 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600;width:100%;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:var(--soft)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:5px 12px;font-size:13.5px;margin:0 6px 6px 0;color:#4d493f}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:3px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
/* vocab rows */
.vrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.vrow:last-child{border-bottom:none}
.vmain{flex:1;min-width:0}
.vko{font-weight:600}
.vvi{color:var(--muted);font-size:14px;display:none;margin-top:2px}
.vrow.open .vvi{display:block}
.hint{font-size:12.5px;color:var(--muted);margin:4px 2px 8px}
.spk{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:15px;flex:none;display:flex;align-items:center;justify-content:center}
/* lesson list */
.lrow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lnum{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#5a5548;flex:none}
.ltit{font-weight:600;font-size:15px}
.lsub{font-size:13px;color:var(--muted)}
.lbar{width:52px;flex:none}
/* grammar */
.gform{font-family:ui-serif,Georgia,serif;font-size:20px;font-weight:700}
.gex{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.gex .vi{color:var(--muted);font-size:13.5px;margin-top:2px}
.gnote{font-size:13.5px;color:#6b5d4f;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-top:10px}
.acc{cursor:pointer}
.accbody{display:none;margin-top:10px}
.acc.open .accbody{display:block}
.chev{color:var(--muted);transition:transform .2s}
.acc.open .chev{transform:rotate(90deg)}
/* flashcards */
.fcwrap{perspective:1200px;margin:6px 0 14px}
.fc{position:relative;height:330px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.fcbig{font-family:ui-serif,Georgia,serif;font-size:30px;font-weight:700;line-height:1.35}
.fcsmall{font-size:20px;font-weight:600;line-height:1.4}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gbtn{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 4px;font-family:inherit;cursor:pointer}
.gbtn b{display:block;font-size:14.5px}
.gbtn span{font-size:11.5px;color:var(--muted)}
.gbtn:active{transform:scale(.97)}
.g0{border-color:#d9b3a6}.g3{border-color:#c9d0b8}
/* quiz */
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:13px 14px;font-size:16px;margin-bottom:9px;font-family:inherit;cursor:pointer}
.opt.ok{border-color:var(--green);background:#EDF1E6}
.opt.no{border-color:var(--red);background:#F6E7E1}
.opt[disabled]{opacity:.55}
.opt.ok[disabled],.opt.no[disabled]{opacity:1}
.expl{background:var(--soft);border-radius:12px;padding:11px 13px;font-size:14.5px;margin:4px 0 12px}
/* tabbar */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(250,249,244,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);z-index:50}
#tabbar .inner{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 3px;color:var(--muted);font-size:11px;border:none;background:none;font-family:inherit;cursor:pointer}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent);font-weight:600}
/* misc */
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.stat:last-child{border:none}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:#5a5548}
.overlay{position:fixed;inset:0;background:rgba(38,36,30,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:82vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom)+24px)}
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.bigxp{font-family:ui-serif,Georgia,serif;font-size:44px;font-weight:700;text-align:center;margin:10px 0 2px}
.center{text-align:center}
.mt{margin-top:12px}
.warn{font-size:13px;color:var(--muted);font-style:italic}
</style>
</head>

<div id="app"></div>
<nav id="tabbar"><div class="inner">

<button class="tab" id="tb-lessons" onclick="setTab('lessons')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C10 4.7 7.2 4 4 4v14c3.2 0 6 .7 8 2 2-1.3 4.8-2 8-2V4c-3.2 0-6 .7-8 2zM12 6v14"/></svg>학습</button>

</div></nav>

/* ================= STATE ================= */
const KEY="hana3b_v1";
let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.cards)return d}catch(e){}return{cards:{},xp:0,streak:0,lastDay:null,last:null,incExp:false,chk:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function touchStreak(){const t=new Date().toDateString();if(S.lastDay===t)return;const y=new Date(Date.now()-864e5).toDateString();S.streak=(S.lastDay===y)?S.streak+1:1;S.lastDay=t;save()}

/* ================= SRS ================= */
function cid(l,t,i){return l+"-"+t+"-"+i}
function lessonVocab(l,inclExp){const o=LS[l-1];let a=o.c.map((p,i)=>({id:cid(l,"c",i),ko:p[0],vi:p[1],l,core:true}));if(inclExp)a=a.concat(o.e.map((p,i)=>({id:cid(l,"e",i),ko:p[0],vi:p[1],l,core:false})));return a}
let VMAP={};LS.forEach(o=>{lessonVocab(o.n,true).forEach(v=>VMAP[v.id]=v)});
const GALL=LS.flatMap(o=>o.g.map(g=>({...g,ln:o.n})));

function grade(id,g){const now=Date.now();let c=S.cards[id]||{ease:2.5,int:0,reps:0,lapse:0};
 if(g===0){c.ease=Math.max(1.3,c.ease-0.2);c.int=0;c.due=now+6e5;c.lapse=(c.lapse||0)+1;c.reps=Math.max(c.reps,1)}
 else{if(c.int===0){c.int=g===1?0.5:g===2?1:3}else{c.int=g===1?Math.max(1,c.int*1.2):g===2?c.int*c.ease:Math.min(365,c.int*c.ease*1.3)}
  if(g===1)c.ease=Math.max(1.3,c.ease-0.15);if(g===3)c.ease=Math.min(2.8,c.ease+0.15);
  c.reps++;c.due=now+c.int*864e5}
 S.cards[id]=c;S.xp+=(g===0?0:g===1?2:5);touchStreak();save()}
function fmtI(d){if(d<0.05)return"10분";if(d<1)return Math.max(1,Math.round(d*24))+"시간";return Math.round(d)+"일"}
function pv(id,g){const c=S.cards[id];if(g===0)return"10분";if(!c||c.int===0)return g===1?"12시간":g===2?"1일":"3일";let i=g===1?Math.max(1,c.int*1.2):g===2?c.int*c.ease:Math.min(365,c.int*c.ease*1.3);return fmtI(i)}
function mast(id){const c=S.cards[id];if(!c)return 0;if(c.int<1)return 1;if(c.int<7)return 2;if(c.int<21)return 3;return 4}
const MLBL=[["새 단어","#A9A395"],["눈에 익음","#C6A15B"],["도움 필요","#C07A4D"],["혼자 사용","#8A9660"],["습득 완료","#5E7A55"]];
function dueIds(){const now=Date.now();return Object.keys(S.cards).filter(id=>S.cards[id].due<=now&&VMAP[id]&&(S.incExp||VMAP[id].core))}
function lessonProg(l){const vs=lessonVocab(l,false);const s=vs.reduce((a,v)=>a+mast(v.id),0);return s/(vs.length*4)}
function studiedLessons(){const set=new Set();Object.keys(S.cards).forEach(id=>{if(VMAP[id])set.add(VMAP[id].l)});return[...set]}

/* ================= TTS ================= */
function speak(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=0.92;speechSynthesis.cancel();speechSynthesis.speak(u)}
function spk(e,t){e.stopPropagation();speak(t)}

/* ================= ROUTER ================= */
let route={v:"home"},stack=[];
function go(v,arg){stack.push(route);route={v,arg};render()}
function back(){route=stack.pop()||{v:"home"};render()}
function setTab(v){stack=[];sess=null;qz=null;route={v};render()}

/* ================= SESSIONS ================= */
let sess=null,qz=null;
function startFlash(l){let cards;const now=Date.now();
 if(l){const vs=lessonVocab(l,S.incExp);const due=vs.filter(v=>S.cards[v.id]&&S.cards[v.id].due<=now);const nw=vs.filter(v=>!S.cards[v.id]);cards=[...due,...nw].slice(0,20);if(!cards.length)cards=shuffle([...vs]).slice(0,20)}
 else{cards=dueIds().map(id=>VMAP[id]).slice(0,40)}
 if(!cards.length)return;
 cards=cards.map(v=>({...v,dir:(mast(v.id)>=3&&Math.random()<0.7)?"vk":"kv"}));
 sess={cards,i:0,flipped:false,done:false,n:{0:0,1:0,2:0,3:0},from:l||null};
 go("flash")}
function flipCard(){if(sess&&!sess.done){sess.flipped=true;render()}}
function doGrade(g){const c=sess.cards[sess.i];grade(c.id,g);sess.n[g]++;sess.i++;sess.flipped=false;if(sess.i>=sess.cards.length)sess.done=true;render();window.scrollTo(0,0)}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(l){let pool,gs;
 if(l){pool=lessonVocab(l,S.incExp);gs=LS[l-1].g.map(g=>({...g,ln:l}))}
 else{const sl=studiedLessons();if(!sl.length)return;pool=sl.flatMap(x=>lessonVocab(x,S.incExp));gs=shuffle(GALL.filter(g=>sl.includes(g.ln))).slice(0,2)}
 const qs=[];const items=shuffle([...pool]).slice(0,6);
 items.forEach((it,k)=>{const others=shuffle(pool.filter(p=>p.ko!==it.ko)).slice(0,3);const opts=shuffle([it,...others]);qs.push({t:k%2?"vk":"kv",item:it,opts,a:opts.indexOf(it)})});
 gs.forEach(g=>{const d1=shuffle(GALL.filter(x=>x.f!==g.f)).slice(0,3);const o1=shuffle([g,...d1]);qs.push({t:"gm",g,opts:o1,a:o1.indexOf(g)});
  const d2=shuffle(GALL.filter(x=>x.f!==g.f)).slice(0,3);const o2=shuffle([g,...d2]);qs.push({t:"gf",g,opts:o2,a:o2.indexOf(g)})});
 qz={qs:shuffle(qs).slice(0,10),i:0,ans:null,score:0,wrong:[],from:l||null};
 go("quiz")}
function pick(oi){if(qz.ans!==null)return;const q=qz.qs[qz.i];qz.ans=oi;
 if(oi===q.a){qz.score++;S.xp+=10}else{qz.wrong.push(q)}
 touchStreak();save();render()}
function nextQ(){qz.i++;qz.ans=null;render();window.scrollTo(0,0)}

/* ================= UI HELPERS ================= */
function toggleExp(){S.incExp=!S.incExp;save();render()}
function setChk(i,v){S.chk[i]=v;save()}
function resetAll(){if(confirm("Xóa toàn bộ tiến độ học? / 모든 학습 데이터를 초기화할까요?")){localStorage.removeItem(KEY);S=load();render()}}
function tgl(el){el.classList.toggle("open")}
function vrows(list,ids){return list.map((v,i)=>{const m=mast(ids?ids[i]:v.id);return `<div class="vrow" onclick="this.classList.toggle('open')">
 <span class="dot" style="background:${MLBL[m][1]}"></span>
 <div class="vmain"><div class="vko">${v.ko}</div><div class="vvi">${v.vi}</div></div>
 <button class="spk" onclick="spk(event,'${v.ko.replace(/'/g,"")}')">🔊</button></div>`}).join("")}

/* ================= VIEWS ================= */
function render(){
 ["home","lessons","practice","grammar"].forEach(t=>{const b=document.getElementById("tb-"+t);if(b)b.classList.toggle("on",route.v===t||(route.v==="lesson"&&t==="lessons")||((route.v==="flash"||route.v==="quiz")&&t==="practice"))});
 const app=document.getElementById("app");
 let h="";
 if(route.v==="home")h=vHome();
 else if(route.v==="lessons")h=vLessons();
 else if(route.v==="lesson")h=vLesson(route.arg);
 else if(route.v==="practice")h=vPractice();
 else if(route.v==="grammar")h=vGrammar();
 else if(route.v==="flash")h=vFlash();
 else if(route.v==="quiz")h=vQuiz();
 else if(route.v==="check")h=vCheck();
 app.innerHTML=h;window.scrollTo(0,0)}

function vHome(){const due=dueIds().length;const last=S.last?LS[S.last-1]:null;
 const total=LS.reduce((a,o)=>a+o.c.length,0);const mastered=LS.flatMap(o=>lessonVocab(o.n,false)).filter(v=>mast(v.id)>=4).length;
 return `<div class="pagehead"><div style="flex:1"><h1>안녕하세요 👋</h1><div class="sub">세종한국어 3B · 중급 1</div></div></div>
 <div class="card"><div style="display:flex;gap:18px">
  <div style="flex:1"><div class="sub">연속 학습</div><div class="serif" style="font-size:26px">🔥 ${S.streak}일</div></div>
  <div style="flex:1"><div class="sub">XP</div><div class="serif" style="font-size:26px">${S.xp}</div></div>
  <div style="flex:1"><div class="sub">습득 어휘</div><div class="serif" style="font-size:26px">${mastered}<span style="font-size:15px;color:var(--muted)">/${total}</span></div></div>
 </div></div>
 <div class="card">
  <div style="font-weight:700;margin-bottom:2px">오늘의 복습</div>
  <div class="sub" style="margin-bottom:12px">${due?`${due}장의 카드가 기다리고 있어요.`:"지금은 복습할 카드가 없어요. 새 단원을 학습해 보세요 🌿"}</div>
  ${due?`<button class="btn primary" onclick="startFlash(null)">복습 시작 · ${due}장</button>`:`<button class="btn ghost" onclick="setTab('lessons')">단원 보러 가기</button>`}
 </div>
 ${last?`<div class="card" onclick="go('lesson',${last.n})" style="cursor:pointer">
  <div class="sub">이어서 학습</div>
  <div style="font-weight:700;margin:2px 0 8px">${last.n}과 · ${last.tp}</div>
  <div class="bar"><i style="width:${Math.round(lessonProg(last.n)*100)}%"></i></div></div>`:""}
 <div class="sec">주제별 진도</div>
 <div class="card">${THEMES.map((t,i)=>{const ls=LS.filter(o=>o.th===i);const p=ls.reduce((a,o)=>a+lessonProg(o.n),0)/ls.length;
   return `<div class="stat"><div><b>${i+1}. ${t[0]}</b><div class="sub" style="font-size:13px">${t[1]}</div></div><div style="width:70px"><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div></div></div>`}).join("")}</div>
 <button class="btn mt" onclick="go('check')">📋 3B 시작 전 체크리스트</button>
 <p class="warn mt center">이 과정은 세종학당 3B 교육과정을 따르며, TOPIK II 3급 준비에 도움이 되지만 합격을 보장하지 않습니다.</p>`}

function vLessons(){return `<div class="pagehead"><div style="flex:1"><h1>학습</h1><div class="sub">6개 주제 · 12개 단원 · 24개 문법</div></div></div>
 ${THEMES.map((t,i)=>`<div class="sec">주제 ${i+1} · ${t[0]}</div><div class="card" style="padding:6px 16px">
 ${LS.filter(o=>o.th===i).map(o=>`<div class="lrow" onclick="go('lesson',${o.n})">
   <div class="lnum">${o.n}과</div>
   <div style="flex:1;min-width:0"><div class="ltit">${o.tp}</div><div class="lsub">${o.tpv}</div></div>
   <div class="lbar"><div class="bar"><i style="width:${Math.round(lessonProg(o.n)*100)}%"></i></div></div>
 </div>`).join("")}</div>`).join("")}`}

function vLesson(n){const o=LS[n-1];S.last=n;save();
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:19px">${n}과 · ${o.tp}</h1><div class="sub">${THEMES[o.th][0]} · ${o.tpv}</div></div></div>
 <div class="card"><div class="serif" style="font-size:18px;line-height:1.5">“${o.t}”</div><div class="sub" style="margin-top:4px">${o.tv}</div>
  <button class="spk mt" onclick="spk(event,'${o.t.replace(/'/g,"")}')">🔊</button></div>
 <div class="row2"><button class="btn primary" onclick="startFlash(${n})">🃏 플래시카드</button><button class="btn" onclick="startQuiz(${n})">✍️ 퀴즈</button></div>
 <div class="sec">오늘의 목표</div><div class="card">${o.goals.map(g=>`<span class="chip">${g}</span>`).join("")}</div>
 <div class="sec">핵심 어휘와 표현 · ${o.c.length}</div>
 <div class="hint">행을 탭하면 뜻이 보여요 — 먼저 스스로 떠올려 보세요.</div>
 <div class="card" style="padding:4px 16px">${vrows(lessonVocab(n,false))}</div>
 <div class="sec">확장 어휘 · ${o.e.length}</div>
 <div class="hint">⚠️ 보조 어휘입니다 — 본 교재의 핵심 어휘가 아니라 활동·워크북 관련 어휘예요.</div>
 <div class="card acc" onclick="tgl(this)" style="cursor:pointer"><div style="display:flex;align-items:center"><b style="flex:1">확장 어휘 펼치기</b><span class="chev">›</span></div>
  <div class="accbody" onclick="event.stopPropagation()">${vrows(lessonVocab(n,true).filter(v=>!v.core))}</div></div>
 ${o.g.map((g,gi)=>`<div class="sec">문법 ${gi+1}</div><div class="card">
   <div style="display:flex;align-items:center"><div class="gform" style="flex:1">${g.f}</div><button class="spk" onclick="spk(event,'${g.ex[0][0].replace(/'/g,"")}')">🔊</button></div>
   <div class="sub" style="margin-top:6px">${g.m}</div>
   ${g.ex.map(e=>`<div class="gex">${e[0]}<div class="vi">${e[1]}</div></div>`).join("")}
   ${g.note?`<div class="gnote">💡 ${g.note}</div>`:""}
 </div>`).join("")}
 ${o.p?`<div class="sec">발음</div><div class="card"><b>${o.p[0]}</b><div class="sub" style="margin-top:4px">${o.p[1]}</div></div>`:""}
 ${o.cul?`<div class="sec">문화</div><div class="card"><b>${o.cul[0]}</b><div class="sub" style="margin-top:4px">${o.cul[1]}</div></div>`:""}
 <div class="sec">말하기 · 쓰기 과제</div>
 <div class="card"><div class="stat"><span>🗣️ <b>말하기</b></span></div><div class="sub" style="padding:6px 2px">${o.ts}</div>
 <div class="stat" style="border-top:1px solid var(--line)"><span>✍️ <b>쓰기</b></span></div><div class="sub" style="padding:6px 2px">${o.tw}</div></div>`}

function vPractice(){const due=dueIds().length;const sl=studiedLessons();
 const all=LS.flatMap(o=>lessonVocab(o.n,S.incExp));const cnt=[0,0,0,0,0];all.forEach(v=>cnt[mast(v.id)]++);
 return `<div class="pagehead"><div style="flex:1"><h1>연습</h1><div class="sub">능동 회상 · 간격 반복(SRS)</div></div></div>
 <div class="card"><b>오늘의 복습</b><div class="sub" style="margin:2px 0 12px">${due?due+"장 대기 중":"복습할 카드가 없어요"}</div>
  <button class="btn primary" ${due?"":"disabled"} onclick="startFlash(null)">복습 시작</button>
  <button class="btn mt" ${sl.length?"":"disabled"} onclick="startQuiz(null)">종합 퀴즈 (학습한 단원)</button></div>
 <div class="sec">새 카드 학습</div>
 <div class="card" style="padding:6px 16px">${LS.map(o=>{const nw=lessonVocab(o.n,S.incExp).filter(v=>!S.cards[v.id]).length;
   return `<div class="lrow" onclick="startFlash(${o.n})"><div class="lnum">${o.n}과</div><div style="flex:1"><div class="ltit">${o.tp}</div><div class="lsub">${nw?`새 카드 ${nw}장`:"모두 학습함"}</div></div><span style="color:var(--muted)">›</span></div>`}).join("")}</div>
 <div class="sec">습득 현황</div>
 <div class="card">${MLBL.map((m,i)=>`<div class="stat"><span style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${m[1]}"></span>${m[0]}</span><span class="pill">${cnt[i]}</span></div>`).join("")}</div>
 <div class="card"><label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" ${S.incExp?"checked":""} onchange="toggleExp()" style="width:20px;height:20px;accent-color:var(--accent)"><span><b>확장 어휘 포함</b><div class="sub" style="font-size:13px">보조 어휘도 연습·퀴즈에 넣기</div></span></label></div>
 <button class="btn" onclick="resetAll()" style="color:var(--red)">데이터 초기화</button>`}

function vGrammar(){return `<div class="pagehead"><div style="flex:1"><h1>문법</h1><div class="sub">3B 핵심 문법 24개</div></div></div>
 ${LS.map(o=>o.g.map((g,gi)=>`<div class="card acc" onclick="tgl(this)">
  <div style="display:flex;align-items:center;gap:10px"><span class="pill">${o.n}과</span><div class="gform" style="flex:1;font-size:17px">${g.f}</div><span class="chev">›</span></div>
  <div class="accbody" onclick="event.stopPropagation()"><div class="sub">${g.m}</div>
   ${g.ex.map(e=>`<div class="gex">${e[0]} <button class="spk" style="width:30px;height:30px;font-size:12px;display:inline-flex;vertical-align:middle" onclick="spk(event,'${e[0].replace(/'/g,"")}')">🔊</button><div class="vi">${e[1]}</div></div>`).join("")}
   ${g.note?`<div class="gnote">💡 ${g.note}</div>`:""}</div></div>`).join("")).join("")}`}

function vFlash(){if(!sess)return vPractice();
 if(sess.done){const tot=sess.cards.length;
  return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>연습 완료</h1></div>
  <div class="card center"><div style="font-size:40px">🌿</div><div class="bigxp">${tot}장</div><div class="sub">잘했어요! 꾸준함이 실력이에요.</div>
  <div class="mt" style="display:flex;justify-content:center;gap:14px;font-size:14px">
   <span>다시 ${sess.n[0]}</span><span>어려움 ${sess.n[1]}</span><span>좋음 ${sess.n[2]}</span><span>쉬움 ${sess.n[3]}</span></div></div>
  <button class="btn primary" onclick="back()">완료</button>`}
 const c=sess.cards[sess.i];const kv=c.dir==="kv";
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button><div style="flex:1"><div class="bar"><i style="width:${Math.round(sess.i/sess.cards.length*100)}%"></i></div></div><span class="pill">${sess.i+1}/${sess.cards.length}</span></div>
 <div class="fcwrap"><div class="fc ${sess.flipped?"flipped":""}" onclick="flipCard()">
  <div class="face"><div class="tag">${kv?"뜻 맞히기":"한국어로 말해 보기"} · ${c.l}과${c.core?"":" · 확장"}</div>
   <div class="${kv?"fcbig":"fcsmall"}">${kv?c.ko:c.vi}</div>
   ${kv?`<button class="spk mt" onclick="spk(event,'${c.ko.replace(/'/g,"")}')">🔊</button>`:""}
   <div class="sub mt" style="font-size:13px">탭해서 확인</div></div>
  <div class="face back"><div class="tag">정답</div>
   <div class="fcbig" style="font-size:24px">${c.ko}</div>
   <div class="sub mt" style="font-size:17px">${c.vi}</div>
   <button class="spk mt" onclick="spk(event,'${c.ko.replace(/'/g,"")}')">🔊</button></div>
 </div></div>
 ${sess.flipped?`<div class="grades">
  <button class="gbtn g0" onclick="doGrade(0)"><b>다시</b><span>${pv(c.id,0)}</span></button>
  <button class="gbtn" onclick="doGrade(1)"><b>어려움</b><span>${pv(c.id,1)}</span></button>
  <button class="gbtn" onclick="doGrade(2)"><b>좋음</b><span>${pv(c.id,2)}</span></button>
  <button class="gbtn g3" onclick="doGrade(3)"><b>쉬움</b><span>${pv(c.id,3)}</span></button></div>
 <p class="hint center mt">솔직하게 평가할수록 복습 간격이 정확해져요.</p>`
 :`<button class="btn" onclick="flipCard()">카드 뒤집기</button>`}`}

function vQuiz(){if(!qz)return vPractice();
 if(qz.i>=qz.qs.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>퀴즈 결과</h1></div>
  <div class="card center"><div class="bigxp">${qz.score}<span style="font-size:22px;color:var(--muted)">/${qz.qs.length}</span></div>
  <div class="sub">${qz.score===qz.qs.length?"완벽해요! 🎉":qz.score>=qz.qs.length*0.7?"좋아요, 거의 다 왔어요.":"괜찮아요 — 틀린 부분을 아래에서 복습해요."}</div></div>
  ${qz.wrong.length?`<div class="sec">다시 볼 항목</div>${qz.wrong.map(q=>{
    if(q.t==="kv"||q.t==="vk")return `<div class="card"><b>${q.item.ko}</b><div class="sub">${q.item.vi}</div></div>`;
    return `<div class="card"><b class="gform" style="font-size:17px">${q.g.f}</b><div class="sub">${q.g.m}</div><div class="gex">${q.g.ex[0][0]}<div class="vi">${q.g.ex[0][1]}</div></div></div>`}).join("")}`:""}
  <button class="btn primary" onclick="back()">완료</button>`}
 const q=qz.qs[qz.i];const answered=qz.ans!==null;
 let prompt,opts,expl;
 if(q.t==="kv"){prompt=`<div class="tag">뜻은 무엇일까요?</div><div class="fcbig" style="font-size:26px">${q.item.ko} <button class="spk" style="display:inline-flex;vertical-align:middle" onclick="spk(event,'${q.item.ko.replace(/'/g,"")}')">🔊</button></div>`;opts=q.opts.map(o=>o.vi);expl=`<b>${q.item.ko}</b> — ${q.item.vi}`}
 else if(q.t==="vk"){prompt=`<div class="tag">한국어로는?</div><div class="fcsmall">${q.item.vi}</div>`;opts=q.opts.map(o=>o.ko);expl=`<b>${q.item.ko}</b> — ${q.item.vi}`}
 else if(q.t==="gm"){prompt=`<div class="tag">이 문법의 의미는? (${q.g.ln}과)</div><div class="gform">${q.g.f}</div>`;opts=q.opts.map(o=>o.s);expl=`<b>${q.g.f}</b>: ${q.g.m}<br>예) ${q.g.ex[0][0]}`}
 else{prompt=`<div class="tag">어떤 문법일까요?</div><div class="fcsmall">“${q.g.s}”</div>`;opts=q.opts.map(o=>o.f);expl=`<b>${q.g.f}</b>: ${q.g.m}<br>예) ${q.g.ex[0][0]}`}
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button><div style="flex:1"><div class="bar"><i style="width:${Math.round(qz.i/qz.qs.length*100)}%"></i></div></div><span class="pill">${qz.i+1}/${qz.qs.length}</span></div>
 <div class="card center" style="padding:26px 18px">${prompt}</div>
 ${opts.map((o,i)=>{let cl="opt";if(answered){if(i===q.a)cl+=" ok";else if(i===qz.ans)cl+=" no"}
   return `<button class="${cl}" ${answered?"disabled":""} onclick="pick(${i})">${o}</button>`}).join("")}
 ${answered?`<div class="expl">${qz.ans===q.a?"✅ 정답!":"❌ 아쉬워요."}<br>${expl}</div><button class="btn primary" onclick="nextQ()">${qz.i+1>=qz.qs.length?"결과 보기":"다음"}</button>`:""}`}

function vCheck(){const done=CHECK.filter((_,i)=>S.chk[i]).length;
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:20px">3B 시작 전 체크리스트</h1><div class="sub">${done}/${CHECK.length} 완료 · 1과 시작 전 확인해 보세요</div></div></div>
 <div class="card">${CHECK.map((c,i)=>`<label class="chk"><input type="checkbox" ${S.chk[i]?"checked":""} onchange="setChk(${i},this.checked)"><span>${c}</span></label>`).join("")}</div>
 <div class="card"><b>우선 점검 영역</b><div class="sub" style="margin-top:6px">말하기 유창성 · 능동 어휘 · 자막 없는 듣기 · 문단 구성 · 조사 사용 · 높임말</div></div>`}

render();
</script>
</body>
</html>
