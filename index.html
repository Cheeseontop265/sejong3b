 if(v===1||v===5||v===6)return s;
 return s+"어"}

  catch(e){r=null}
  if(r&&r.ok)break;
  if(r&&r.status===401)throw new Error("API key sai. Kiểm tra ở ⚙️.");
  if(a===1)throw new Error(r?("Lỗi máy chủ ("+r.status+") — thử lại sau nhé."):"Mạng lỗi — kiểm tra kết nối rồi bấm thử lại.");
  await new Promise(z=>setTimeout(z,800))}
 const d=await r.json();S.api=(S.api||0)+1;
 const m=((d.content&&d.content[0]&&d.content[0].text)||"").match(/\{[\s\S]*\}/);
 if(!m){save();throw new Error("AI trả về sai định dạng — bấm thử lại.")}
 let out;try{out=deepClean(JSON.parse(m[0]))}catch(e){save();throw new Error("AI trả về sai định dạng — bấm thử lại.")}
 if(!noCache){S.aiCache[ck]=out;const ks=Object.keys(S.aiCache);if(ks.length>24)delete S.aiCache[ks[0]]}
 save();return out}

 <button class="modecard" onclick="go('notes')"><span class="micon">📒</span><span style="flex:1"><span class="mtit">오답 노트 · Sổ câu sai</span><br><span class="msub">${(S.notes||[]).length} câu đã lưu</span></span></button>

 <button class="btn sm mt" onclick="resetAll()" style="color:var(--red)">Xóa toàn bộ (cẩn thận!)</button></div>`}

 <div class="row2" style="margin-bottom:14px"><button class="btn primary" onclick="startContrast()">⚖️ Đấu ngữ pháp</button><button class="btn" onclick="startConj(0)">🔤 Chia động từ</button></div>
 ${LS.map(o=>o.g.map(g=>`<div class="card acc" onclick="tgl(this)">

function vRead(){const types=[["all","Tất cả"],["story","Truyện"],["dlg","Hội thoại"],["txt","Thực dụng"]];
 return `<div class="pagehead"><div style="flex:1"><h1>Đọc</h1><div class="sub">${READ.length} bài · chạm từ để xem nghĩa</div></div></div>
 <div class="card"><b>✨ Tạo bài đọc mới bằng AI</b><div class="sub" style="margin-top:2px">Chọn bài → nhận văn bản mới, lưu vĩnh viễn · 1 lần gọi API</div>
 <div style="display:flex;gap:8px;margin-top:10px"><select id="rgl" class="tinput" style="flex:1;margin:0;min-height:44px">${LS.map(o=>`<option value="${o.n}">${o.n}과 · ${o.tp}</option>`).join("")}</select>
 <button class="btn sm primary" style="width:auto;padding:0 18px;flex:none" ${rg.busy?"disabled":""} onclick="genRead()">${rg.busy?"...":"Tạo"}</button></div>
 ${rg.busy?`<div class="center mt"><div class="spin"></div></div>`:""}${rg.err?`<div class="expl bad mt">⚠️ ${rg.err} <button class="btn sm ghost mt" onclick="genRead()">Thử lại</button></div>`:""}</div>
 <div style="display:flex;gap:7px;margin-bottom:12px">${types.map(t=>`<button class="btn sm ${rf===t[0]?"primary":""}" style="width:auto;flex:1" onclick="rf='${t[0]}';render()">${t[1]}</button>`).join("")}</div>
 ${READ.map((P,pi)=>({P,pi})).filter(x=>rf==="all"||(x.P.ty||"story")===rf).map(({P,pi})=>{
 const st=S.read[pi]||{};const total=(HUNT[pi]&&HUNT[pi].length)?4:3;
 const done=(st.done?1:0)+(st.hunt?1:0)+(st.cloze?1:0)+(st.order?1:0);
 const icon=(P.ty||"story")==="dlg"?"💬":(P.ty==="txt"?"📋":"📖");
 return `<button class="modecard" onclick="openPassage(${pi})"><span class="micon">${done>=total?"✅":icon}</span><span style="flex:1"><span class="mtit">${P.t}</span><br><span class="msub">${P.l}과 · hoạt động ${done}/${total}</span></span><span style="color:var(--muted)">›</span></button>`}).join("")}`}
function vPassage(pi){const P=READ[pi];if(!rp||rp.pi!==pi)rp={pi,act:"read",ans:{},hFound:{},hi:0,cl:null,ci:0,cAns:null,cok:0,ord:null};
 const hs=HUNT[pi]||[];const st=S.read[pi]||{};
 const acts=[["read","📖 Đọc",0],["q","❓ Câu hỏi",st.done],...(hs.length?[["hunt","🔍 Tìm NP",st.hunt]]:[]),["cloze","🧩 Điền",st.cloze],["order","↕ Sắp xếp",st.order]];
 let body="";
 if(rp.act==="read"){body=`<div class="hint">Chạm từ chưa biết — nghĩa tiếng Việt hiện bên dưới.</div><div class="card">${linesHTML(pi)}</div><button class="btn ghost" onclick="setAct('q')">Đọc xong → làm câu hỏi</button>`}
 else if(rp.act==="q"){body=P.q.map((q,qi)=>{const an=rp.ans[qi];
 return `<div class="card"><b style="font-size:15px">${qi+1}. ${q.q}</b><div class="mt">${q.o.map((o,oi)=>{let cl="opt";if(an!==undefined){if(oi===q.a)cl+=" ok";else if(oi===an)cl+=" no"}return `<button class="${cl}" ${an!==undefined?"disabled":""} onclick="rqPick(${qi},${oi})">${o}</button>`}).join("")}</div></div>`}).join("")
 +(Object.keys(rp.ans).length===P.q.length?`<div class="card center"><div style="font-size:28px">🌿</div><b>Hiểu ${P.q.filter((q,i)=>rp.ans[i]===q.a).length}/${P.q.length}</b></div>`:"")}
 else if(rp.act==="hunt"){const h=hs[rp.hi];
 body=h?`<div class="card" style="background:var(--accent-soft)"><b>🔍 ${rp.hi+1}/${hs.length}</b> — Tìm và chạm từ chứa mẫu <b class="gform" style="font-size:17px">${h.f}</b><div class="sub" style="margin-top:4px">${(GALL.find(x=>x.f===h.f)||{}).s||""}</div></div><div class="card">${linesHTML(pi)}</div>`
 :`<div class="card center" style="background:var(--okbg)"><div style="font-size:28px">🎉</div><b>Tìm xong! +8 XP</b><div class="sub">Từ xanh = mẫu đã tìm thấy</div></div><div class="card">${linesHTML(pi)}</div>`}
 else if(rp.act==="cloze"){if(!rp.cl)rp.cl=mkCloze(P);
 if(rp.ci>=rp.cl.length){body=`<div class="card center"><div style="font-size:28px">🧩</div><b>Điền ${rp.cok}/${rp.cl.length}</b></div><button class="btn" onclick="rp.cl=mkCloze(READ[rp.pi]);rp.ci=0;rp.cAns=null;rp.cok=0;render()">🔁 Bộ điền mới</button>`}
 else{const c=rp.cl[rp.ci];const sn=P.s[c.si];
 body=`<div class="hint">Điền ${rp.ci+1}/${rp.cl.length} — chọn từ đúng ngữ cảnh. Từ khác vẫn chạm được để xem nghĩa.</div>
 <div class="card"><div class="rtxt" style="font-size:18px;line-height:2">${sn.map((t,ti)=>ti===c.ti?`<span style="background:var(--accent-soft);border-radius:8px;padding:2px 12px;color:var(--accent);font-weight:700">____</span>`:`<span class="tok" onclick="tapTok(${pi},${c.si},${ti})">${t[0]}</span>`).join(" ")}</div></div>
 ${c.opts.map((o,oi)=>{let c2="opt";if(rp.cAns!==null){if(o===c.w)c2+=" ok";else if(oi===rp.cAns)c2+=" no"}return `<button class="${c2}" ${rp.cAns!==null?"disabled":""} onclick="clPick(${oi})">${o}</button>`}).join("")}
 ${rp.cAns!==null?`<button class="btn primary" onclick="clNext()">${rp.ci+1>=rp.cl.length?"Kết quả":"Tiếp"}</button>`:""}`}}
 else{if(!rp.ord){const n=P.s.length;rp.ord={perm:mkPerm(n),chosen:[],state:null}}
 const rem=rp.ord.perm.filter(k=>!rp.ord.chosen.includes(k));
 body=`<div class="hint">Chạm các câu theo đúng thứ tự mạch văn.</div>
 <div class="ansline">${rp.ord.chosen.map((k,i)=>`<button class="opt" style="margin-bottom:6px;font-size:14px" onclick="odUndo(${i})"><b>${i+1}.</b> ${sentTxt(P,k)}</button>`).join("")||`<span class="hint">Chọn câu đầu tiên</span>`}</div>
 ${rem.map(k=>`<button class="opt" style="font-size:14px" onclick="odTap(${k})">${sentTxt(P,k)}</button>`).join("")}
 ${rp.ord.state==="ok"?`<div class="expl good">✅ Đúng thứ tự! +10 XP</div><button class="btn primary" onclick="setAct('read')">📖 Đọc lại</button>`
 :rp.ord.state==="no"?`<div class="expl bad">❌ Chưa đúng. Chú ý từ nối 그리고·그런데·그래서.</div><button class="btn primary" onclick="odRetry()">Thử lại</button>`
 :`<button class="btn primary mt" ${rp.ord.chosen.length===P.s.length?"":"disabled"} onclick="odCheck()">Kiểm tra</button>`}`}
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:19px">${P.t}</h1><div class="sub">${P.l}과</div></div>
 <button class="spk" onclick="spk(event,'${P.s.map(sn=>sn.map(t=>t[0]).join(" ")).join(" ").replace(/['"]/g,"")}')">🔊</button></div>
 <div style="display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px">${acts.map(a=>`<button class="btn sm ${rp.act===a[0]?"primary":""}" style="width:auto;flex:none;padding:0 13px" onclick="setAct('${a[0]}')">${a[1]}${a[2]?" ✓":""}</button>`).join("")}</div>${body}`}

 :it.opts.map((o,i)=>`<button class="opt" onclick="cjPick(${i})">${(w.pre||"")+o}</button>`).join("")}`}

function vMock(){if(!MK)return vMockList();
 if(MK.phase==="intro"){const w3=W532[MK.t%10];
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>제${MK.t+1}회</h1></div>
 <div class="card"><b>Quy chế phòng thi 📋</b><div class="sub" style="margin-top:6px">· ⏱ 20:00 đếm ngược — hết giờ <b>tự nộp</b><br>· 🎧 Câu 1–2: nghe đúng <b>1 lần</b> · Câu 3–4: tối đa 2 lần<br>· Được quay lại sửa đáp án bằng nút ← →<br>· ✍️ Cuối bài có 2 câu viết (chủ đề hôm nay: “${w3.t}”)${S.akey?"":"<br>⚠️ Chưa có API key → phần viết không được chấm (điểm tính trên 80)"}<br>· Ngồi nơi yên tĩnh, không tra từ điển 🤫</div></div>
 <button class="btn primary" onclick="m2Begin()">시험 시작 · Bắt đầu</button>`}
 if(MK.phase==="grading")return `<div class="pagehead"><h1>Đang chấm 쓰기...</h1></div><div class="card center"><div class="spin"></div><div class="sub mt">Giám khảo AI đang chấm theo rubric TOPIK...</div></div>`;
 if(MK.phase==="done"){const s=MK.score;const noW=!MK.wRes||MK.wRes.err;
 const lv=noW?(MK.obj>=56?"Nền trắc nghiệm vững cấp 3 (chưa tính 쓰기)":MK.obj>=40?"Sát ngưỡng — luyện thêm":"Cần ôn lại nền tảng")
 :(s>=70?"Vững mức cấp 3 (mô phỏng) 🏅":s>=55?"Chạm ngưỡng cấp 3 — bù phần sai":s>=40?"Ranh giới — tập trung phần yếu":"Chưa đạt — ôn bài rồi thi lại");
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>제${MK.t+1}회 결과</h1></div>
 <div class="card center"><div class="bigxp">${s}<span style="font-size:20px;color:var(--muted)">/${noW?80:100}</span></div><div class="sub">${lv}</div>
 <div class="mt" style="display:flex;justify-content:center;gap:16px;font-size:14px"><span>🎧 ${MK.secs.L}/32</span><span>📖 ${MK.secs.R}/48</span><span>✍️ ${noW?"—":MK.secs.W+"/20"}</span></div></div>
 ${MK.wRes&&!MK.wRes.err?`<div class="sec">✍️ Chấm bài viết</div>
 <div class="card"><span class="pill">51 · ${MK.wRes.w51.score}/8</span><div class="sub mt">💡 ${MK.wRes.w51.why||""}</div><div class="gex">Mẫu: ${MK.wRes.w51.fix||W512[MK.t%10].m}</div></div>
 <div class="card"><span class="pill">53 · ${MK.wRes.w53.score}/12</span><div class="sub mt">Nội dung ${MK.wRes.w53.c}/4 · Mạch lạc ${MK.wRes.w53.o}/4 · Ngôn ngữ ${MK.wRes.w53.l}/4</div><div class="sub mt">💡 ${MK.wRes.w53.why||""}</div>${MK.wRes.w53.fix?`<div class="gex">${MK.wRes.w53.fix}</div>`:""}</div>`:""}
 <div class="sec">Xem lại câu sai</div>
 ${MK.qs.map((q,i)=>MK.ans[i]===q.c?"":`<div class="card"><span class="pill">${q.sec} ${i+1}</span>
 ${q.tp==="L"?`<div class="sub mt">📜 ${q.au} <button class="spk" style="display:inline-flex;width:28px;height:28px;font-size:11px" onclick="spk(event,'${q.au.replace(/'/g,"")}')">🔊</button></div>`:""}
 <div class="mt" style="font-weight:600;white-space:pre-line">${q.q}</div>
 ${q.lines?`<div class="sub mt">${q.lines.join("<br>")}</div>`:""}
 <div class="mt"><span class="worig">${q.o[MK.ans[i]]??"(bỏ trống)"}</span> → <span class="wfix">${q.o[q.c]}</span></div>
 ${q.x?`<div class="sub" style="margin-top:5px">💡 ${q.x}</div>`:""}${q.ln?`<div class="sub">→ Ôn bài ${q.ln}과</div>`:""}
 ${q.pi!==undefined?`<button class="btn sm ghost mt" onclick="openPassage(${q.pi})">📖 Đọc lại (có nghĩa từ)</button>`:""}</div>`).join("")||`<div class="card center" style="background:var(--okbg)">🎉 Trắc nghiệm đúng hết!</div>`}
 <div class="row2"><button class="btn" onclick="startMock(MK.t)">🔁 Thi lại</button><button class="btn primary" onclick="back()">Xong</button></div>`}
 const N=MK.qs.length;
 if(MK.i>=N){const w5=W512[MK.t%10],w3=W532[MK.t%10];
 return `<div class="pagehead"><span class="pill">✍️ 쓰기</span><div style="flex:1"></div><span class="pill" id="mtmr">--:--</span></div>
 <div class="card"><b>51.</b> ㉠에 들어갈 알맞은 말을 <b>한 문장</b>으로 쓰십시오. (8점)<div class="gex" style="white-space:pre-line">${w5.t}</div><div class="hint">Gợi ý: ${w5.h}</div>
 <input class="tinput" type="text" placeholder="㉠ = ..." value="${MK.w51.replace(/"/g,"")}" oninput="MK.w51=this.value"></div>
 <div class="card"><b>53.</b> 다음을 참고하여 <b>120~180자</b>로 쓰십시오. (12점)<div class="gex"><b>${w3.t}</b><div class="sub" style="white-space:pre-line;margin-top:4px">${w3.b}</div><div class="sub mt">권장 문법: ${w3.g}</div></div>
 <textarea class="tinput" placeholder="여기에 쓰십시오..." oninput="w53cnt(this)">${MK.w53}</textarea>
 <div class="hint" id="w53c">${MK.w53.replace(/\s/g,"").length}자</div></div>
 <div class="row2"><button class="btn" onclick="MK.i=${N-1};render()">← Câu ${N}</button><button class="btn primary" onclick="m2Submit()">제출 · Nộp bài</button></div>`}
 const q=MK.qs[MK.i];const sel=MK.ans[MK.i];const plays=MK.plays[MK.i]||0;
 return `<div class="pagehead"><button class="backbtn" onclick="if(confirm('Thoát? Bài thi sẽ mất.')){clearInterval(MKIV);MK=null;back()}">✕</button>
 <div style="flex:1"><div class="bar"><i style="width:${Math.round(MK.i/(N+1)*100)}%"></i></div></div>
 <span class="pill">${MK.i+1}/${N} · ${q.sec}</span><span class="pill" id="mtmr">--:--</span></div>
 ${(q.tp==="T"||q.tp==="R")?`<div class="card" style="max-height:210px;overflow-y:auto"><div style="line-height:1.85;font-size:15.5px">${READ[q.pi].s.map(sn=>sn.map(t=>t[0]).join(" ")).join(" ")}</div></div>`:""}
 ${q.tp==="L"?`<div class="qprompt"><div class="tag">🎧 ${q.max===1?"CHỈ NGHE 1 LẦN":"tối đa 2 lần"} · còn ${q.max-plays}</div>
 <button class="btn sm ${plays>=q.max?"":"primary"}" style="max-width:170px;margin:0 auto" ${plays>=q.max?"disabled":""} onclick="m2Play()">🔊 ${plays===0?"재생":"다시 듣기"}</button>
 <div class="qmid mt" style="font-size:16.5px">${q.q}</div></div>`
 :`<div class="qprompt"><div class="qmid" style="font-size:16.5px;white-space:pre-line">${q.q}</div>${q.lines?`<div class="mt" style="text-align:left;font-size:15px;line-height:1.9;background:var(--soft);border-radius:12px;padding:10px 12px">${q.lines.join("<br>")}</div>`:""}</div>`}
 ${q.o.map((o,i)=>`<button class="opt ${sel===i?"pick":""}" onclick="m2Pick(${i})">${"①②③④"[i]} ${o}</button>`).join("")}
 <div class="row2 mt"><button class="btn" ${MK.i===0?"disabled":""} onclick="m2Nav(-1)">← Trước</button><button class="btn primary" onclick="${MK.i===N-1?("MK.i="+N+";render()"):"m2Nav(1)"}">${MK.i===N-1?"→ Phần 쓰기":"Tiếp →"}</button></div>`}
function vDict(){if(!dt)return vPractice();
 if(dt.i>=dt.list.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>Hoàn thành</h1></div>
 <div class="card center"><div class="bigxp">${dt.ok}<span style="font-size:22px;color:var(--muted)">/${dt.list.length}</span></div><div class="sub">Nghe và gõ = luyện nghe sâu nhất.</div></div>
 <button class="btn primary" onclick="back()">Xong</button>`}
 const q=dtQ();
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button><div style="flex:1"><div class="bar"><i style="width:${Math.round(dt.i/dt.list.length*100)}%"></i></div></div><span class="pill">${dt.i+1}/${dt.list.length}</span></div>
 <div class="qprompt"><div class="tag">🎧 Nghe và gõ lại nguyên câu · ${q.l}과</div>
 <button class="btn sm ghost" style="max-width:170px;margin:0 auto" onclick="dtReplay()">🔊 Nghe lại</button></div>
 ${dt.ans?`<div class="expl ${dt.ans.ok?"good":"bad"}">${dt.ans.ok?"✅ "+yay():"❌ Chưa đúng."}<br><b>${q.ko}</b><div class="sub">${q.vi}</div>${!dt.ans.ok&&dt.typed?`<div class="mt" style="font-size:13.5px">Bạn gõ: <span class="worig">${dt.typed}</span></div>`:""}</div>
 <button class="btn primary" onclick="dtNext()">Tiếp</button>`
 :`<input class="tinput" type="text" placeholder="Gõ câu vừa nghe..." value="${dt.typed.replace(/"/g,"")}" oninput="dt.typed=this.value" onkeydown="if(event.key==='Enter')dtCheck()" autocapitalize="off" autocorrect="off" autocomplete="off">
 <button class="btn primary" onclick="dtCheck()">Kiểm tra</button><p class="hint center mt">Dấu cách/chấm câu được bỏ qua khi chấm.</p>`}`}
function vWrite(n){const o=n?LS[n-1]:null;const g=WGUIDE[n||0];wInit(n||0);
 if(!S.akey||wr.setup){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:20px">Cài AI (1 lần)</h1></div></div>
 <div class="card"><b>1.</b> console.anthropic.com → API Keys<br><b>2.</b> Dán vào đây
 <input class="tinput mt" type="password" id="akey" placeholder="sk-ant-..." value="${S.akey}">
 <div class="sub" style="margin-bottom:6px">Model</div><input class="tinput" type="text" id="amodel" value="${S.amodel}">
 <button class="btn primary" onclick="saveKey()">Lưu</button>
 <div class="hint mt">🔒 Key chỉ lưu trên máy · không nằm trong sao lưu · mỗi lần chấm ≈ vài trăm đồng</div></div>`}
 const stBox=t=>t==="ok"?["✅","good"]:t==="fix"?["⚠️","bad"]:["❌","bad"];
 let body="";
 if(wr.mode==="gym"){body=`<div class="hint mt">3 từ bạn yếu nhất được chọn tự động. Mỗi câu phải chứa <b>ngữ pháp + từ vựng</b>.</div>
 ${wr.ms.map((m,i)=>{const it=wr.gym&&wr.gym.items&&wr.gym.items[i];
 return `<div class="card" style="padding:13px 14px"><span class="pill">NP</span> <b class="gform" style="font-size:15.5px">${m.g.f}</b> <span class="sub" style="font-size:12.5px">${m.g.s}</span><br><span class="pill">Từ</span> <b>${m.v.ko}</b> <span class="sub" style="font-size:12.5px">${m.v.vi}</span>
 ${it?`<div class="expl ${stBox(it.status)[1]}" style="margin-top:10px">${stBox(it.status)[0]} ${it.status==="ok"?"Hoàn hảo!":""}
 ${it.status==="fix"?`<div style="margin-top:4px"><span class="worig">${m.text}</span><br>→ <span class="wfix">${it.fixed||""}</span></div>`:""}
 ${it.status==="off"?`<div style="margin-top:4px">Mẫu: <b>${it.model||""}</b></div>`:""}
 <div class="sub" style="margin-top:5px">💡 ${it.why||""}</div>
 ${(it.status!=="ok"&&(it.fixed||it.model))?`<button class="btn sm ghost mt" ${wr.saved["g"+i]?"disabled":""} onclick="addNoteG(${i})">${wr.saved["g"+i]?"✓ Đã lưu":"➕ Lưu vào sổ câu sai"}</button>`:""}</div>`
 :`<input class="tinput" style="margin:10px 0 0" type="text" placeholder="Một câu dùng cả hai..." value="${m.text.replace(/"/g,"")}" oninput="wr.ms[${i}].text=this.value" onchange="render()">
 <div class="hint" style="margin:6px 0 0">${usedV(m.v.ko,m.text)?"✅ đã có từ vựng":"chưa thấy từ vựng"} · NP thì AI kiểm tra</div>`}</div>`}).join("")}
 ${wr.gym?`${wr.gym.tip?`<div class="card gnote">💡 ${wr.gym.tip}</div>`:""}<div class="row2"><button class="btn" onclick="newMissions()">🔁 Nhiệm vụ mới (free)</button><button class="btn primary" onclick="back()">Xong</button></div>`
 :`<button class="btn primary mt" ${wr.busy?"disabled":""} onclick="aiGym(${n||0})">${wr.busy?"Đang chấm...":"Chấm 3 câu · 1 lần API"}</button>
 <p class="hint center mt">Đúng → từ đó giãn lịch ôn tự động.</p>`}`}
 else if(wr.mode==="guide"){body=`${g.qs.map((q,i)=>`<div class="card" style="padding:12px 14px"><b style="font-size:15px">${i+1}. ${q[0]}</b><div class="sub" style="font-size:12.5px;margin-bottom:8px">${q[1]}</div>
 <input class="tinput" style="margin:0" type="text" placeholder="Một câu..." value="${(wr.ans[i]||"").replace(/"/g,"")}" oninput="wr.ans[${i}]=this.value"></div>`).join("")}
 <button class="btn sm ghost mt" ${wr.ideaBusy?"disabled":""} onclick="aiIdeas(${n||0})">${wr.ideaBusy?"...":"💡 Xin ý tưởng AI · 1 lần"}</button>
 ${wr.idea?`<div class="card mt" style="background:var(--accent-soft)"><b>💡 ${wr.idea.angle||""}</b><div class="gex">${wr.idea.opening||""}</div>${(wr.idea.extra||[]).map(e=>`<div class="sub mt" style="font-size:13px">· ${e}</div>`).join("")}</div>`:""}
 <button class="btn primary mt" onclick="wDraft()">📝 Ghép thành bài (free)</button>`}
 else{body=`<div class="mt">${g.st.map(s=>`<button class="wchip" style="font-size:13.5px" onclick="wStarter('${s}')">💬 ${s}</button>`).join("")}</div>
 <div class="mt">${wr.ms.map(m=>`<span class="chip" style="${usedV(m.v.ko,wr.text)?"background:var(--okbg);color:var(--green)":""}">${usedV(m.v.ko,wr.text)?"✅ ":""}${m.v.ko}</span>`).join("")}${o?o.g.map(x=>`<span class="chip">${x.f}</span>`).join(""):""}</div>
 <textarea class="tinput mt" placeholder="Viết bằng tiếng Hàn..." oninput="wr.text=this.value" onchange="render()">${wr.text}</textarea>
 <div class="hint">${wr.text.split(/[.!?]/).filter(x=>x.trim()).length} câu · khuyến nghị ≥3</div>
 <button class="btn primary" ${wr.busy?"disabled":""} onclick="aiCheck(${n||0})">${wr.busy?"Đang chấm...":"Nhận chấm bài · 1 lần API"}</button>`}
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:20px">✍️ Luyện viết</h1><div class="sub">${o?o.n+"과 · "+o.tp:"Tự do"} · API ${S.api||0} lần</div></div>
 <button class="spk" onclick="go('notes')">📒</button><button class="spk" onclick="wr.setup=true;render()">⚙️</button></div>
 <div class="card"><b>Đề bài</b><div class="sub" style="margin-top:4px">${o?o.tw:"Viết tự do 3-5 câu."}</div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
 <button class="btn sm ${wr.mode==="gym"?"primary":""}" onclick="wr.mode='gym';render()">🎯 3 câu</button>
 <button class="btn sm ${wr.mode==="guide"?"primary":""}" onclick="wr.mode='guide';render()">🧭 Có gợi ý</button>
 <button class="btn sm ${wr.mode==="free"?"primary":""}" onclick="wr.mode='free';render()">✏️ Tự do</button></div>
 ${body}
 ${wr.busy?`<div class="card center mt"><div class="spin"></div><div class="sub mt">Cô giáo đang đọc bài...</div></div>`:""}
 ${wr.err?`<div class="expl bad mt">⚠️ ${wr.err}</div>`:""}
 ${wr.res?`<div class="sec">Mục tiêu đạt được</div><div class="card">${(wr.res.targets||[]).map(t=>`<div class="stat"><span>${t.status==="ok"?"✅":t.status==="fix"?"⚠️":"❌"} ${t.item}</span><span class="sub" style="font-size:12.5px;text-align:right">${t.comment||""}</span></div>`).join("")}</div>
 <div class="sec">Nhận xét</div><div class="card">${wr.res.overall||""}</div>
 ${(wr.res.corrections&&wr.res.corrections.length)?wr.res.corrections.map((c,ci)=>`<div class="card"><span class="pill">${c.type||""}</span>
 <div class="mt" style="font-size:16px"><span class="worig">${c.orig}</span> → <span class="wfix">${c.fix}</span></div>
 <div class="sub" style="margin-top:6px">💡 ${c.why}</div>
 <button class="btn sm ghost mt" ${wr.saved["c"+ci]?"disabled":""} onclick="addNoteC(${ci})">${wr.saved["c"+ci]?"✓ Đã lưu":"➕ Lưu vào sổ"}</button></div>`).join("")
 :`<div class="card" style="background:var(--okbg)">🎉 Không có lỗi — xuất sắc!</div>`}
 ${wr.res.natural?`<div class="sec">Bản tự nhiên</div><div class="card"><div style="line-height:1.8">${wr.res.natural}</div><button class="spk mt" onclick="spk(event,'${(wr.res.natural||"").replace(/['"\n]/g," ")}')">🔊</button></div>`:""}
 ${wr.res.tip?`<div class="card gnote" style="margin-top:12px">💡 ${wr.res.tip}</div>`:""}
 <button class="btn mt" onclick="wr.res=null;render()">Sửa lại và nộp lần nữa</button>`:""}`}
function vNotes(){const ns=S.notes||[];
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:20px">📒 Sổ câu sai</h1><div class="sub">${ns.length} câu của riêng bạn</div></div></div>
 <button class="btn primary" onclick="startNoteScram()" ${ns.length?"":"disabled"}>🧩 Ghép lại câu của mình (free)</button>

function vSmart(){if(!sm)return vPractice();
 if(sm.i>=sm.q.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>Hoàn thành</h1></div>
 <div class="card center"><div style="font-size:40px">🌿</div><div class="bigxp">${sm.ok}<span style="font-size:20px;color:var(--muted)"> đúng</span></div>
 <div class="sub">${sm.bad?`${sm.bad} câu sai đã được lặp lại đến khi bạn làm đúng.`:"Đúng hết ngay lượt đầu!"}</div></div>
 <button class="btn primary" onclick="back()">Xong</button>`}
 const it=smCur(),v=it.v,left=sm.q.length-sm.i;let body="";
 const fb=sm.ans?`<div class="expl ${sm.ans.ok?"good":"bad"}">${sm.ans.ok?"✅ ":"❌ "}${sm.fb}<br><b>${v.ko}</b> — ${v.vi}</div><button class="btn primary" onclick="smNext()">Tiếp</button>`:"";
 if(it.ex==="mc_kv"||it.ex==="mc_vk"){const kv=it.ex==="mc_kv";

 else if(it.ex==="flip"){body=`<div class="fcwrap"><div class="fc ${sm.flip?"flipped":""}" onclick="smFlip()">

 <div class="face back"><div class="tag">Đáp án</div><div class="qbig" style="font-size:23px">${v.ko}</div><div class="sub mt" style="font-size:17px">${v.vi}</div></div></div></div>

 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button><div style="flex:1"><div class="bar"><i style="width:${Math.round(sm.i/sm.q.length*100)}%"></i></div></div><span class="pill">Còn ${left}</span></div>${body}`}

 if(sc.i>=sc.list.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>Hoàn thành</h1></div>

 const q=scQ();const used=new Set(sc.chosen);
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button><div style="flex:1"><div class="bar"><i style="width:${Math.round(sc.i/sc.list.length*100)}%"></i></div></div><span class="pill">${sc.i+1}/${sc.list.length}</span></div>

 <div class="ansline">${sc.chosen.map((wi,ci)=>`<button class="wchip" onclick="scUndo(${ci})">${q.words[wi]}</button>`).join("")||`<span class="hint">Chạm các mảnh theo thứ tự</span>`}</div>
 <div>${q.words.map((w,wi)=>`<button class="wchip ${used.has(wi)?"used":""}" onclick="scTap(${wi})">${w}</button>`).join("")}</div>

 :sc.state==="no"?`<div class="expl bad">❌ Đáp án:<br><b>${q.ko}</b><br><span class="sub">${q.vi}</span></div><button class="btn primary" onclick="scNext()">Tiếp</button>`
 :`<button class="btn primary mt" ${sc.chosen.length===q.words.length?"":"disabled"} onclick="scCheck()">Kiểm tra</button>`}`}
function vContrast(){if(!ct)return vPractice();

 ${q.opts.map((o,i)=>{let cl="opt";if(ct.ans!==null){if(i===q.a)cl+=" ok";else if(i===ct.ans)cl+=" no"}return `<button class="${cl}" ${ct.ans!==null?"disabled":""} onclick="ctPick(${i})" style="text-align:center;font-weight:700">${o}</button>`}).join("")}

function vQuiz(){if(!qz)return vPractice();

 <button class="btn primary" onclick="back()">Xong</button>`}
 const q=qz.qs[qz.i],an=qz.ans!==null;let prompt,opts,expl;
 if(q.t==="kv"){prompt=`<div class="tag">Nghĩa là gì?</div><div class="qbig">${q.item.ko}</div>`;opts=q.opts.map(o=>o.vi);expl=`<b>${q.item.ko}</b> — ${q.item.vi}`}
 else if(q.t==="vk"){prompt=`<div class="tag">Bằng tiếng Hàn?</div><div class="qmid">${q.item.vi}</div>`;opts=q.opts.map(o=>o.ko);expl=`<b>${q.item.ko}</b> — ${q.item.vi}`}
 else if(q.t==="gm"){prompt=`<div class="tag">Mẫu này nghĩa gì? (${q.g.ln}과)</div><div class="gform">${q.g.f}</div>`;opts=q.opts.map(o=>o.s);expl=`<b>${q.g.f}</b>: ${q.g.m}`}
 else{prompt=`<div class="tag">Là mẫu nào?</div><div class="qmid">“${q.g.s}”</div>`;opts=q.opts.map(o=>o.f);expl=`<b>${q.g.f}</b>: ${q.g.m}`}
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button><div style="flex:1"><div class="bar"><i style="width:${Math.round(qz.i/qz.qs.length*100)}%"></i></div></div><span class="pill">${qz.i+1}/${qz.qs.length}</span></div>
 <div class="qprompt">${prompt}</div>
 ${opts.map((o,i)=>{let cl="opt";if(an){if(i===q.a)cl+=" ok";else if(i===qz.ans)cl+=" no"}return `<button class="${cl}" ${an?"disabled":""} onclick="pick(${i})">${o}</button>`}).join("")}
 ${an?`<div class="expl ${qz.ans===q.a?"good":"bad"}">${qz.ans===q.a?"✅":"❌"} ${expl}</div><button class="btn primary" onclick="nextQ()">${qz.i+1>=qz.qs.length?"Kết quả":"Tiếp"}</button>`:""}`}
function vCheck(){const done=CHECK.filter((_,i)=>S.chk[i]).length;
 return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:20px">Checklist trước 3B</h1><div class="sub">${done}/${CHECK.length}</div></div></div>
 <div class="card">${CHECK.map((c,i)=>`<label class="chk"><input type="checkbox" ${S.chk[i]?"checked":""} onchange="setChk(${i},this.checked)"><span>${c}</span></label>`).join("")}</div>`}
function vHelp(){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><div style="flex:1"><h1 style="font-size:20px">📘 Hướng dẫn</h1></div></div>
<div class="card"><b>App là gì?</b><div class="sub" style="margin-top:6px">Tự học trọn 세종 3B: 12 bài, 24 ngữ pháp, ${READ.length}+ bài đọc, máy chia động từ, 10 đề thi thử. Offline, dữ liệu trên máy bạn. Nguyên tắc: chủ động nhớ lại + lặp ngắt quãng (SRS).</div></div>
<div class="sec">Điểm mạnh nên dùng mỗi ngày</div>
<div class="card"><div class="sub">🧠 <b>Ôn SRS</b>: đúng → giãn lịch; sai → quay lại 10 phút và lặp trong buổi.<br>🔤 <b>Chia động từ</b>: 공부하다→공부해/했어요...; bất quy tắc ㅂㄷ르ㅡㄹ; đáp án nhiễu là lỗi kinh điển; mẫu bạn hay sai được hỏi nhiều hơn; giỏi rồi thì chuyển sang GÕ tay.<br>🎓 <b>TOPIK thử</b>: đếm ngược 20 phút, nghe 1–2 lượt đúng luật thi, có 쓰기 51+53 AI chấm; nộp mới có điểm; xem lại từng câu sai kèm giải thích + bài cần ôn.<br>📖 <b>Đọc</b>: chạm từ = nghĩa Việt; nhiều hoạt động/bài; ✨ tạo bài mới bằng AI.<br>✍️ <b>Viết</b>: 3 câu với từ yếu → AI chấm (1 lần gọi); lưu câu sai vào 📒 rồi ghép lại.</div></div>
<div class="sec">Lộ trình 15 phút/ngày</div>
<div class="card"><div class="sub">1️⃣ Ôn SRS hết thẻ (5') → 2️⃣ 🔤 10 câu chia ĐT (4') → 3️⃣ 1 bài đọc (5'). Tối: 🎯 3 câu viết. Cuối tuần: 1 đề TOPIK + 💾 xuất sao lưu.</div></div>
<div class="card"><b>Mẹo</b><div class="sub" style="margin-top:4px">· Bàn phím Hàn: Cài đặt→Bàn phím→Thêm Hàn ngữ<br>· Thêm vào màn hình chính từ Safari<br>· ĐỪNG xóa dữ liệu web Safari — sẽ mất tiến độ (hãy sao lưu!)<br>· 듣기 dùng giọng máy (TTS) — gần ngày thi hãy nghe thêm băng thu đề 기출 thật.</div></div>`}
render();
/* ===== OVERRIDE v6 — Ghép câu nâng cấp (xáo trộn + mảnh bẫy) · Xóa 듣고 만들기 ===== */
function lastWord(s){const w=s.split(" ");return w[w.length-1].replace(/[.?!,]/g,"")}
function scBuild(ko,vi,l,trapWords){
 const words=ko.split(" ");
 const traps=[...new Set(trapWords.filter(w=>w&&w.length>=2&&!words.includes(w)))].slice(0,2);
 let chips,g=0;
 do{chips=shuffle([...words.map(w=>({w,r:1})),...traps.map(w=>({w,r:0}))])}
 while(++g<15&&chips.length>1&&chips.every((c,i)=>c.w===(words[i]||"")));
 return{l,ko,vi,chips,wlen:words.length}}
function startScram(l){let pool=SENT.filter(s=>l?s[0]===l:true);
 if(!l){const sl=studiedLessons();if(sl.length)pool=SENT.filter(s=>sl.includes(s[0]))}
 if(pool.length<3)pool=SENT;
 sc={list:shuffle([...pool]).slice(0,6).map(s=>scBuild(s[1],s[2],s[0],shuffle(pool.filter(x=>x[1]!==s[1])).slice(0,5).map(x=>lastWord(x[1])))),i:0,chosen:[],state:null};
 go("scram")}
function startNoteScram(){const ns=(S.notes||[]).filter(x=>x.ko.split(" ").length>=3);
 if(!ns.length){alert("Sổ còn trống. Lưu câu từ phần chấm AI nhé.");return}
 sc={list:shuffle([...ns]).slice(0,6).map(x=>scBuild(x.ko,x.why,"note",shuffle(ns.filter(y=>y.ko!==x.ko)).slice(0,5).map(y=>lastWord(y.ko)))),i:0,chosen:[],state:null};
 go("scram")}
function scTap(ci){if(sc.state)return;if(sc.chosen.includes(ci))return;sc.chosen.push(ci);render()}
function scUndo(k){if(sc.state)return;sc.chosen.splice(k,1);render()}
function scCheck(){const q=scQ();
 if(sc.chosen.map(i=>q.chips[i].w).join(" ")===q.ko){sc.state="ok";S.xp+=8;touchStreak();save();speak(q.ko)}else sc.state="no";render()}
function scNext(){sc.i++;sc.chosen=[];sc.state=null;render()}
function vScram(){if(!sc)return vPractice();
 if(sc.i>=sc.list.length){return `<div class="pagehead"><button class="backbtn" onclick="back()">‹</button><h1>Hoàn thành</h1></div>
 <div class="card center"><div style="font-size:40px">🧩</div><div class="bigxp">${sc.list.length} câu</div><div class="sub">Xếp đúng cả khi có mảnh bẫy = nắm chắc cả nghĩa lẫn trật tự.</div></div>
 <button class="btn primary" onclick="back()">Xong</button>`}
 const q=scQ();const used=new Set(sc.chosen);const traps=q.chips.filter(c=>!c.r).length;
 return `<div class="pagehead"><button class="backbtn" onclick="back()">✕</button><div style="flex:1"><div class="bar"><i style="width:${Math.round(sc.i/sc.list.length*100)}%"></i></div></div><span class="pill">${sc.i+1}/${sc.list.length}</span></div>
 <div class="qprompt" style="padding:18px"><div class="tag">Ghép câu · ${q.l}${typeof q.l==="number"?"과":""}</div>
 <div class="qmid" style="font-size:16.5px;color:var(--muted)">${q.vi}</div>
 ${traps?`<div class="hint" style="margin-top:8px">⚠️ Có ${traps} mảnh BẪY — không phải mảnh nào cũng dùng!</div>`:""}</div>
 <div class="ansline">${sc.chosen.map((ci,k)=>`<button class="wchip" onclick="scUndo(${k})">${q.chips[ci].w}</button>`).join("")||`<span class="hint">Chạm các mảnh theo thứ tự · cần ${q.wlen} mảnh</span>`}</div>
 <div>${q.chips.map((c,ci)=>`<button class="wchip ${used.has(ci)?"used":""}" onclick="scTap(${ci})">${c.w}</button>`).join("")}</div>
 ${sc.state==="ok"?`<div class="expl good">✅ ${yay()}<br><b>${q.ko}</b><br><span class="sub">${q.vi}</span></div><button class="btn primary" onclick="scNext()">Tiếp</button>`
 :sc.state==="no"?`<div class="expl bad">❌ Đáp án:<br><b>${q.ko}</b><br><span class="sub">${q.vi}</span>${sc.chosen.some(i=>!q.chips[i].r)?`<div class="mt" style="font-size:13.5px">Bạn đã dính mảnh bẫy: <span class="worig">${sc.chosen.filter(i=>!q.chips[i].r).map(i=>q.chips[i].w).join(", ")}</span></div>`:""}</div><button class="btn primary" onclick="scNext()">Tiếp</button>`
 :`<button class="btn primary mt" ${sc.chosen.length===q.wlen?"":"disabled"} onclick="scCheck()">Kiểm tra</button>`}`}
function vPractice(){const due=dueIds().length;
 const all=LS.flatMap(o=>lessonVocab(o.n,S.incExp));const cnt=[0,0,0,0,0];all.forEach(v=>cnt[mast(v.id)]++);
 return `<div class="pagehead"><div style="flex:1"><h1>Luyện tập</h1><div class="sub">Ít bài hơn, chất hơn — mỗi dạng đều ép bạn tự nhớ lại</div></div></div>
 <button class="modecard" onclick="startSmart(null)" ${due?"":"disabled"}><span class="micon">🧠</span><span style="flex:1"><span class="mtit">스마트 복습 · Ôn SRS</span><br><span class="msub">${due?due+" thẻ · trắc nghiệm→lật→gõ":"Chưa có thẻ đến hạn"}</span></span>${due?`<span class="pill">${due}</span>`:""}</button>
 <button class="modecard" onclick="startConj(0)"><span class="micon">🔤</span><span style="flex:1"><span class="mtit">활용 훈련 · Chia động từ</span><br><span class="msub">Điểm yếu số 1 — luyện mỗi ngày · bất quy tắc ㅂㄷ르ㅡㄹ · máy ưu tiên mẫu bạn hay sai</span></span></button>
 <button class="modecard" onclick="startDict()"><span class="micon">⌨️</span><span style="flex:1"><span class="mtit">받아쓰기 · Nghe–chép</span><br><span class="msub">Luyện nghe sâu nhất — phục vụ mục tiêu xem phim, hội thoại</span></span></button>
 <button class="modecard" onclick="startContrast()"><span class="micon">⚖️</span><span style="flex:1"><span class="mtit">문법 대결 · Đấu ngữ pháp</span><br><span class="msub">2 mẫu dễ nhầm + giải thích VÌ SAO</span></span></button>
 <button class="modecard" onclick="go('write',0)"><span class="micon">🎯</span><span style="flex:1"><span class="mtit">쓰기 훈련 · Luyện viết</span><br><span class="msub">Từ yếu + ngữ pháp, AI chấm → lưu vào sổ câu sai</span></span></button>

 <button class="modecard" onclick="go('mocklist')"><span class="micon">🎓</span><span style="flex:1"><span class="mtit">TOPIK 모의고사 · Thi thử</span><br><span class="msub">1 đề/tuần · nghe/đọc/viết · ⏱ 20 phút · chấm /100</span></span></button>
 <button class="modecard" onclick="go('notes')"><span class="micon">📒</span><span style="flex:1"><span class="mtit">오답 노트 · Sổ câu sai</span><br><span class="msub">${(S.notes||[]).length} câu đã lưu · ghép lại câu của chính mình</span></span></button>
 <div class="sec">Học thẻ mới theo bài</div>
 <div class="card" style="padding:6px 16px">${LS.map(o=>{const nw=lessonVocab(o.n,S.incExp).filter(v=>!S.cards[v.id]).length;
 return `<div class="lrow" onclick="startSmart(${o.n})"><div class="lnum">${o.n}과</div><div style="flex:1"><div class="ltit">${o.tp}</div><div class="lsub">${nw?nw+" thẻ mới":"Đã học hết"}</div></div><span style="color:var(--muted)">›</span></div>`}).join("")}</div>
 <div class="sec">Mức độ thuộc</div>
 <div class="card">${MLBL.map((m,i)=>`<div class="stat"><span style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${m[1]}"></span>${m[0]}</span><span class="pill">${cnt[i]}</span></div>`).join("")}</div>
 <div class="card"><label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" ${S.incExp?"checked":""} onchange="toggleExp()" style="width:20px;height:20px;accent-color:var(--accent)"><span><b>Gồm cả từ mở rộng</b></span></label></div>
 <div class="sec">Dữ liệu</div>
 <div class="card"><div class="row2"><button class="btn sm" onclick="exportData()">💾 Xuất sao lưu</button><button class="btn sm" onclick="document.getElementById('impf').click()">📥 Nhập</button></div>
 <input type="file" id="impf" accept=".json" style="display:none" onchange="importData(event)">

 <div class="hint mt">Sao lưu không chứa API key. Nên xuất mỗi tuần.</div>
 <button class="btn sm mt" onclick="resetAll()" style="color:var(--red)">Xóa toàn bộ (cẩn thận!)</button></div>`}
